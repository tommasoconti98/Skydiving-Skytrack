<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SkyTrack Drop-Log</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root {
      --bg: #0f0f10;
      --card-bg: #1c1c1e;
      --card-border: #2c2c2e;
      --card-hover: #262629;
      --accent-cyan: #38bdf8;
      --accent-yellow: #f59e0b;
      --text-main: #ffffff;
      --text-muted: #71717a;
      --fr24-color: #fbc02d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px 14px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 580px;
      width: 100%;
      margin: 0 auto;
    }

    /* HEADER HOME (IDENTICO ALLO SCREENSHOT) */
    .home-header {
      margin-bottom: 24px;
      padding-top: 6px;
    }
    .home-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--accent-yellow);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .home-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* LISTA AEREI */
    .aircraft-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .aircraft-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
      text-decoration: none;
    }
    .aircraft-card:active {
      background-color: var(--card-hover);
      border-color: #3f3f46;
    }

    .card-left {
      flex: 1;
      min-width: 0;
    }
    .card-reg {
      font-size: 1.18rem;
      font-weight: 700;
      color: var(--accent-cyan);
      margin-bottom: 3px;
    }
    .card-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-model {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .card-right {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: 12px;
    }

    /* FOTO SULLA DESTRA DELLA RIGA */
    .aircraft-thumb {
      width: 64px;
      height: 44px;
      border-radius: 8px;
      overflow: hidden;
      background: #111;
      border: 1px solid #333;
      flex-shrink: 0;
    }
    .aircraft-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-arrow {
      color: #52525b;
      font-size: 1.1rem;
      font-weight: 600;
    }

    /* VISTA DETTAGLIO AEREO */
    #view-detail {
      display: none;
    }

    .detail-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .btn-back {
      background: #27272a;
      color: #fff;
      border: 1px solid #3f3f46;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-back:hover { background: #3f3f46; }

    /* CERCHIETTO PULSANTE FLIGHTRADAR24 */
    .btn-fr24 {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #26210f;
      border: 2px solid var(--fr24-color);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--fr24-color);
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .btn-fr24:active {
      transform: scale(0.94);
      background: var(--fr24-color);
      color: #000;
    }
    .btn-fr24 svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .detail-header-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* MAPPA LEAFLET */
    #map {
      width: 100%;
      height: 340px;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      margin-bottom: 14px;
      background: #0d0d0d;
    }

    /* CARD STATISTICHE LANCIO */
    .stats-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .stats-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stats-title strong { color: #fff; }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat-box {
      background: #242426;
      border: 1px solid #323236;
      border-radius: 8px;
      padding: 10px 12px;
    }
    .stat-lbl {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stat-num {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent-cyan);
      margin-top: 3px;
    }

    .btn-history-open {
      width: 100%;
      background: #27272a;
      color: #fff;
      border: 1px solid #3f3f46;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .btn-history-open:active { background: #38383a; }

    /* MODAL STORICO */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }

    .modal-box {
      background: #18181a;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      width: 100%;
      max-width: 500px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-top {
      padding: 14px 18px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-top h4 { font-size: 1rem; color: #fff; }
    .btn-close-modal {
      background: none;
      border: none;
      color: #888;
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
    }
    .modal-scroll {
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .hist-row {
      background: #222225;
      border: 1px solid #2e2e32;
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .hist-row:active { background: #2a2a2e; }
    .hist-row-left .title { font-weight: 600; font-size: 0.92rem; color: #fff; }
    .hist-row-left .sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
    .hist-row-right { font-weight: 700; font-size: 0.95rem; color: var(--accent-cyan); text-align: right; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- VISTA 1: HOME (IDENTICA ALLO SCREENSHOT ORIGINALE) -->
    <div id="view-list">
      <div class="home-header">
        <div class="home-title">
          <span>✈</span> SKYTRACK DROP-LOG
        </div>
        <div class="home-subtitle">
          Seleziona un velivolo per vedere la telemetria di lancio
        </div>
      </div>

      <div class="aircraft-list" id="fleet-list">
        <!-- Generato dinamicamente -->
      </div>
    </div>

    <!-- VISTA 2: DETTAGLIO AEREO (MAPPA + LIVE FR24 + STATS + STORICO) -->
    <div id="view-detail">
      <div class="detail-nav">
        <button class="btn-back" onclick="showListView()">
          <span>←</span> Torna alla flotta
        </button>

        <!-- Cerchietto Flightradar24 -->
        <a id="fr24-link-btn" href="#" target="_blank" rel="noopener noreferrer" class="btn-fr24" title="Visualizza Live su Flightradar24">
          <svg viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
            <path d="M12 6a6 6 0 0 0-6 6h2a4 4 0 0 1 4-4V6zm0-4A10 10 0 0 0 2 12h2a8 8 0 0 1 8-8V2z"/>
          </svg>
        </a>
      </div>

      <div class="detail-header-card">
        <div>
          <div class="card-reg" id="detail-reg">--</div>
          <div class="card-name" id="detail-name">--</div>
          <div class="card-model" id="detail-model">--</div>
        </div>
        <div class="aircraft-thumb" id="detail-thumb-box" style="display:none; width:72px; height:50px;">
          <img id="detail-thumb-img" src="" alt="Aircraft">
        </div>
      </div>

      <!-- Mappa con vista satellitare -->
      <div id="map"></div>

      <!-- Scheda Dati Ultimo Lancio -->
      <div class="stats-card">
        <div class="stats-title">
          <span id="detail-run-label">Ultimo Lancio</span>
          <strong id="detail-run-date">--</strong>
        </div>

        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-lbl">Asse di Lancio</div>
            <div class="stat-num" id="stat-heading">--°</div>
          </div>
          <div class="stat-box">
            <div class="stat-lbl">Ground Speed</div>
            <div class="stat-num" id="stat-speed">-- kt</div>
          </div>
          <div class="stat-box">
            <div class="stat-lbl">Durata Passaggio</div>
            <div class="stat-num" id="stat-duration">--s</div>
          </div>
          <div class="stat-box">
            <div class="stat-lbl">Sep. 300m</div>
            <div class="stat-num" id="stat-sep">--s</div>
          </div>
        </div>

        <button class="btn-history-open" onclick="openHistoryModal()">
          <span>📋</span> Storico Lanci (<span id="history-count">0</span>)
        </button>
      </div>
    </div>

  </div>

  <!-- MODAL STORICO -->
  <div class="modal-backdrop" id="modal-history">
    <div class="modal-box">
      <div class="modal-top">
        <h4 id="modal-ac-title">Storico Lanci</h4>
        <button class="btn-close-modal" onclick="closeHistoryModal()">&times;</button>
      </div>
      <div class="modal-scroll" id="modal-history-list"></div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let map = null, activePolyline = null, startMarker = null, endMarker = null;
    let masterData = null;
    let fleetConfig = {};
    let selectedAircraft = null;

    function initMap() {
      if (map) return;
      map = L.map('map', { zoomControl: true }).setView([42.5, 12.5], 7);

      // Layer Satellitare ESRI HD
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri',
        maxZoom: 18
      }).addTo(map);

      // Etichette strade e città CartoDB Dark
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png', {
        subdomains: 'abcd',
        maxZoom: 18
      }).addTo(map);
    }

    async function loadData() {
      try {
        const [indexRes, fleetRes] = await Promise.all([
          fetch('data/index.json?v=' + Date.now()).then(r => r.json()),
          fetch('aircraft.json?v=' + Date.now()).then(r => r.json()).catch(() => [])
        ]);

        masterData = indexRes;
        fleetConfig = {};
        if (Array.isArray(fleetRes)) {
          fleetRes.forEach(ac => { fleetConfig[ac.reg] = ac; });
        }

        renderListView();
      } catch (err) {
        console.error('Errore caricamento dati:', err);
      }
    }

    function renderListView() {
      const container = document.getElementById('fleet-list');
      container.innerHTML = '';

      masterData.aircrafts.forEach(ac => {
        const cfg = fleetConfig[ac.reg] || {};
        const photoUrl = cfg.photo || '';

        const card = document.createElement('div');
        card.className = 'aircraft-card';
        card.onclick = () => openAircraftDetail(ac.reg);

        card.innerHTML = `
          <div class="card-left">
            <div class="card-reg">${ac.reg}</div>
            <div class="card-name">${cfg.name || ac.name || ''}</div>
            <div class="card-model">${cfg.model || ac.model || 'Pilatus PC-6'}</div>
          </div>

          <div class="card-right">
            ${photoUrl ? `
              <div class="aircraft-thumb">
                <img src="${photoUrl}" alt="${ac.reg}" onerror="this.parentElement.style.display='none'">
              </div>
            ` : ''}
            <div class="card-arrow">&gt;</div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function openAircraftDetail(reg) {
      selectedAircraft = masterData.aircrafts.find(a => a.reg === reg);
      if (!selectedAircraft) return;

      const cfg = fleetConfig[reg] || {};

      // Imposta Header Dettaglio
      document.getElementById('detail-reg').textContent = reg;
      document.getElementById('detail-name').textContent = cfg.name || selectedAircraft.name || '';
      document.getElementById('detail-model').textContent = cfg.model || selectedAircraft.model || 'Pilatus PC-6';

      // Imposta Foto nel dettaglio
      const thumbBox = document.getElementById('detail-thumb-box');
      const thumbImg = document.getElementById('detail-thumb-img');
      if (cfg.photo) {
        thumbImg.src = cfg.photo;
        thumbBox.style.display = 'block';
      } else {
        thumbBox.style.display = 'none';
      }

      // Imposta link cerchietto FlightRadar24
      const fr24Btn = document.getElementById('fr24-link-btn');
      fr24Btn.href = `https://www.flightradar24.com/data/aircraft/${reg.toLowerCase()}`;

      // Switch visualizzazione
      document.getElementById('view-list').style.display = 'none';
      document.getElementById('view-detail').style.display = 'block';
      window.scrollTo(0, 0);

      // Inizializza mappa e carica traccia
      initMap();
      setTimeout(() => { map.invalidateSize(); }, 150);

      const runs = selectedAircraft.runs || [];
      document.getElementById('history-count').textContent = runs.length;

      if (runs.length > 0) {
        displayRun(runs[0], true);
      } else {
        document.getElementById('detail-run-label').textContent = 'Nessun lancio recente';
        document.getElementById('detail-run-date').textContent = '';
        document.getElementById('stat-heading').textContent = '--°';
        document.getElementById('stat-speed').textContent = '-- kt';
        document.getElementById('stat-duration').textContent = '--s';
        document.getElementById('stat-sep').textContent = '--s';
      }
    }

    function showListView() {
      document.getElementById('view-detail').style.display = 'none';
      document.getElementById('view-list').style.display = 'block';
      window.scrollTo(0, 0);
    }

    async function displayRun(runMeta, fitMap) {
      document.getElementById('detail-run-label').textContent = runMeta.title || 'Lancio';
      document.getElementById('detail-run-date').textContent = `${runMeta.date} ${runMeta.time} UTC`;
      document.getElementById('stat-heading').textContent = `${runMeta.heading_deg}°`;
      document.getElementById('stat-speed').textContent = `${runMeta.speed_kt} kt`;
      document.getElementById('stat-duration').textContent = `${runMeta.duration_sec}s`;
      
      const spd = runMeta.speed_kt || 0;
      const sep = spd > 0 ? (300 / (spd * 0.514444)).toFixed(1) : 0;
      document.getElementById('stat-sep').textContent = `${sep}s`;

      try {
        const res = await fetch(`data/runs/${runMeta.file}?v=` + Date.now());
        const data = await res.json();
        if (!data.points || data.points.length === 0) return;

        const latlngs = data.points.map(p => [p.lat, p.lon]);

        if (activePolyline) map.removeLayer(activePolyline);
        if (startMarker) map.removeLayer(startMarker);
        if (endMarker) map.removeLayer(endMarker);

        activePolyline = L.polyline(latlngs, {
          color: '#00e5ff',
          weight: 5,
          opacity: 0.9,
          lineJoin: 'round'
        }).addTo(map);

        startMarker = L.circleMarker(latlngs[0], {
          radius: 7,
          fillColor: '#00e676',
          color: '#fff',
          weight: 2,
          fillOpacity: 1
        }).addTo(map);

        endMarker = L.circleMarker(latlngs[latlngs.length - 1], {
          radius: 7,
          fillColor: '#ff1744',
          color: '#fff',
          weight: 2,
          fillOpacity: 1
        }).addTo(map);

        if (fitMap) {
          map.fitBounds(activePolyline.getBounds(), { padding: [40, 40], maxZoom: 15 });
        }
      } catch (e) {
        console.error('Errore caricamento coordinate:', e);
      }
    }

    // GESTIONE MODAL STORICO
    function openHistoryModal() {
      if (!selectedAircraft) return;
      document.getElementById('modal-ac-title').textContent = `Storico ${selectedAircraft.reg}`;
      const list = document.getElementById('modal-history-list');
      list.innerHTML = '';

      const runs = selectedAircraft.runs || [];
      if (runs.length === 0) {
        list.innerHTML = '<div style="color:#777; text-align:center; padding:20px;">Nessun lancio disponibile.</div>';
      } else {
        runs.forEach(r => {
          const row = document.createElement('div');
          row.className = 'hist-row';
          row.innerHTML = `
            <div class="hist-row-left">
              <div class="title">${r.date} - ${r.title || 'Lancio'}</div>
              <div class="sub">Ore: ${r.time} UTC | Durata: ${r.duration_sec}s</div>
            </div>
            <div class="hist-row-right">
              ${r.heading_deg}° / ${r.speed_kt} kt
            </div>
          `;
          row.onclick = () => {
            closeHistoryModal();
            displayRun(r, true);
          };
          list.appendChild(row);
        });
      }

      document.getElementById('modal-history').classList.add('open');
    }

    function closeHistoryModal() {
      document.getElementById('modal-history').classList.remove('open');
    }

    window.onclick = function(e) {
      const modal = document.getElementById('modal-history');
      if (e.target === modal) closeHistoryModal();
    };

    window.onload = loadData;
  </script>
</body>
</html>
