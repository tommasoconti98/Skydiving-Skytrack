<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SkyTrack - Dropzone Run Tracker</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%; background: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      overflow: hidden; display: flex; flex-direction: column;
    }
    
    /* Top Bar con Selettore Aereo */
    #top-bar {
      background: #0d0d0d; padding: 10px 14px; display: flex;
      justify-content: space-between; align-items: center;
      border-bottom: 2px solid #222; z-index: 1000;
    }
    .brand { font-size: 14px; font-weight: 900; color: #ffcc00; letter-spacing: 1.5px; }
    select {
      background: #1c1c1c; color: #00e5ff; border: 1px solid #333;
      padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 700;
      outline: none; cursor: pointer;
    }

    /* Dashboard Metriche */
    #hud {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 6px; padding: 8px; background: #121212; border-bottom: 2px solid #282828;
      z-index: 1000;
    }
    .metric-card {
      background: #1a1a1a; padding: 8px 10px; border-radius: 6px;
      border: 1px solid #2a2a2a; display: flex; flex-direction: column;
    }
    .metric-title { font-size: 10px; font-weight: 800; color: #777; text-transform: uppercase; }
    .metric-val-wrap { display: flex; align-items: baseline; gap: 4px; margin-top: 2px; }
    .metric-val { font-size: 32px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
    .metric-unit { font-size: 13px; font-weight: 700; opacity: 0.8; }
    
    .c-alt { color: #ffcc00; }
    .c-trk { color: #00e5ff; }
    .c-spd { color: #00ff66; }
    .c-sep { color: #ff3366; }

    /* Mappa */
    #map { flex: 1; width: 100%; background: #050505; }

    /* Pulsante & Pannello Storico */
    #history-toggle-btn {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #181818; color: #fff; border: 1px solid #444;
      padding: 12px 24px; border-radius: 30px; font-size: 13px; font-weight: 800;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8); cursor: pointer; z-index: 1100;
      display: flex; align-items: center; gap: 8px;
    }
    #history-toggle-btn:hover { background: #222; border-color: #00e5ff; }

    #history-drawer {
      position: absolute; bottom: 0; left: 0; width: 100%; max-height: 55%;
      background: #111; border-top: 2px solid #333; z-index: 1200;
      display: none; flex-direction: column; border-radius: 16px 16px 0 0;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.9);
    }
    .drawer-header {
      padding: 14px 16px; display: flex; justify-content: space-between;
      align-items: center; border-bottom: 1px solid #222;
    }
    .drawer-title { font-size: 14px; font-weight: 800; color: #fff; }
    .close-btn { background: none; border: none; color: #888; font-size: 18px; cursor: pointer; }
    .runs-list { overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .run-item {
      background: #1c1c1c; padding: 12px 14px; border-radius: 8px;
      display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; border: 1px solid #292929;
    }
    .run-item:hover { border-color: #ffcc00; background: #222; }
    .run-date { font-size: 13px; font-weight: 800; color: #fff; }
    .run-time { font-size: 11px; color: #888; margin-top: 2px; }
    .run-stats-tag { font-size: 12px; font-weight: 700; color: #00e5ff; }

    @media (max-width: 650px) {
      #hud { grid-template-columns: 1fr 1fr; }
      .metric-val { font-size: 28px; }
    }
  </style>
</head>
<body>

  <div id="top-bar">
    <div class="brand">✈ SKYTRACK DROP-LOG</div>
    <select id="aircraft-select" onchange="onAircraftChanged()"></select>
  </div>

  <div id="hud">
    <div class="metric-card">
      <div class="metric-title">Quota Lancio</div>
      <div class="metric-val-wrap c-alt"><span class="metric-val" id="val-alt">--</span><span class="metric-unit">m</span></div>
    </div>
    <div class="metric-card">
      <div class="metric-title">Asse di Lancio</div>
      <div class="metric-val-wrap c-trk"><span class="metric-val" id="val-trk">--</span><span class="metric-unit">°</span></div>
    </div>
    <div class="metric-card">
      <div class="metric-title">Ground Speed</div>
      <div class="metric-val-wrap c-spd"><span class="metric-val" id="val-spd">--</span><span class="metric-unit">kt</span></div>
    </div>
    <div class="metric-card">
      <div class="metric-title">Sep 300m</div>
      <div class="metric-val-wrap c-sep"><span class="metric-val" id="val-sep">--</span><span class="metric-unit">s</span></div>
    </div>
  </div>

  <div id="map"></div>

  <button id="history-toggle-btn" onclick="toggleHistory(true)">📂 STORICO LANCI (ULTIMI 30 GG)</button>

  <div id="history-drawer">
    <div class="drawer-header">
      <div class="drawer-title" id="drawer-title">Storico Decolli</div>
      <button class="close-btn" onclick="toggleHistory(false)">✕</button>
    </div>
    <div class="runs-list" id="runs-list"></div>
  </div>

  <script>
    // Inizializzazione Mappa con Satellite Esri World Imagery
    const map = L.map('map', { zoomControl: false }).setView([40.4720, 14.9608], 14);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 18, attribution: 'Esri Satellite'
    }).addTo(map);

    let masterData = null;
    let currentTrajectoryLine = null;
    let markersLayer = L.layerGroup().addTo(map);

    async function loadIndex() {
      try {
        const res = await fetch('data/index.json?v=' + Date.now());
        masterData = await res.json();
        
        const sel = document.getElementById('aircraft-select');
        sel.innerHTML = '';
        masterData.aircrafts.forEach(ac => {
          const opt = document.createElement('option');
          opt.value = ac.reg;
          opt.innerText = ac.name;
          sel.appendChild(opt);
        });

        if (masterData.aircrafts.length > 0) {
          onAircraftChanged();
        }
      } catch(e) {
        console.error("Errore caricamento index.json:", e);
      }
    }

    function onAircraftChanged() {
      const reg = document.getElementById('aircraft-select').value;
      const ac = masterData.aircrafts.find(a => a.reg === reg);
      if (!ac) return;

      renderRunsList(ac);

      if (ac.runs && ac.runs.length > 0) {
        // Carica automaticamente l'ultimo lancio registrato
        loadRun(ac.runs[0].file);
      } else {
        clearHUD();
      }
    }

    function renderRunsList(aircraft) {
      const listEl = document.getElementById('runs-list');
      listEl.innerHTML = '';
      document.getElementById('drawer-title').innerText = `Lanci Registrati - ${aircraft.reg}`;

      if (!aircraft.runs || aircraft.runs.length === 0) {
        listEl.innerHTML = '<div style="padding:20px;text-align:center;color:#666;">Nessun lancio registrato negli ultimi 30 giorni.</div>';
        return;
      }

      aircraft.runs.forEach(r => {
        const item = document.createElement('div');
        item.className = 'run-item';
        item.onclick = () => {
          loadRun(r.file);
          toggleHistory(false);
        };
        item.innerHTML = `
          <div>
            <div class="run-date">${r.date} - ${r.title}</div>
            <div class="run-time">Ore: ${r.time} UTC | Durata run: ${r.duration_sec}s</div>
          </div>
          <div class="run-stats-tag">${r.heading_deg}° / ${r.speed_kt} kt</div>
        `;
        listEl.appendChild(item);
      });
    }

    async function loadRun(jsonPath) {
      try {
        const res = await fetch(`data/runs/${jsonPath}?v=` + Date.now());
        const data = await res.json();

        // Aggiorna HUD
        document.getElementById('val-alt').innerText = data.stats.altitude_m;
        document.getElementById('val-trk').innerText = data.stats.heading_deg;
        document.getElementById('val-spd').innerText = data.stats.ground_speed_kt;
        document.getElementById('val-sep').innerText = data.stats.separation_sec;

        // Disegna Traccia
        if (currentTrajectoryLine) map.removeLayer(currentTrajectoryLine);
        markersLayer.clearLayers();

        const points = data.points.map(p => [p.lat, p.lon]);
        
        // Linea asse di lancio (Arancione fluorescente)
        currentTrajectoryLine = L.polyline(points, {
          color: '#ff6600', weight: 5, opacity: 0.95
        }).addTo(map);

        // Marker Inizio Run-In
        L.circleMarker(points[0], { radius: 6, color: '#00ff66', fillColor: '#00ff66', fillOpacity: 1 })
          .bindTooltip("Inizio Run", { permanent: false })
          .addTo(markersLayer);

        // Marker Fine Run-In (Uscita)
        L.circleMarker(points[points.length - 1], { radius: 7, color: '#ff0033', fillColor: '#ff0033', fillOpacity: 1 })
          .bindTooltip("Fine Run / Picchiata", { permanent: false })
          .addTo(markersLayer);

        map.fitBounds(currentTrajectoryLine.getBounds(), { padding: [50, 50] });

      } catch(e) {
        console.error("Errore caricamento run:", e);
      }
    }

    function clearHUD() {
      document.getElementById('val-alt').innerText = '--';
      document.getElementById('val-trk').innerText = '--';
      document.getElementById('val-spd').innerText = '--';
      document.getElementById('val-sep').innerText = '--';
      if (currentTrajectoryLine) map.removeLayer(currentTrajectoryLine);
      markersLayer.clearLayers();
    }

    function toggleHistory(show) {
      document.getElementById('history-drawer').style.display = show ? 'flex' : 'none';
    }

    loadIndex();
  </script>
</body>
</html>
