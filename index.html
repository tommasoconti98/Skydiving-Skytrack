<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyTrack - Skydiving Run Monitor</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root {
      --bg-dark: #121212;
      --card-bg: #1e1e1e;
      --card-hover: #262626;
      --card-border: #333333;
      --accent-cyan: #00e5ff;
      --fr24-yellow: #fbc02d;
      --text-main: #f5f5f5;
      --text-muted: #9e9e9e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background-color: #181818;
      border-bottom: 1px solid var(--card-border);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .brand span { color: var(--accent-cyan); }

    .main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 58px);
      position: relative;
    }

    /* Mappa */
    #map {
      flex: 1;
      height: 100%;
      background: #0d0d0d;
    }

    /* Sidebar Flotta */
    .sidebar {
      width: 440px;
      max-width: 100%;
      background-color: rgba(18, 18, 18, 0.95);
      backdrop-filter: blur(8px);
      border-left: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      z-index: 1000;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--card-border);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    .fleet-list {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Scheda Aereo */
    .aircraft-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      overflow: hidden;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .aircraft-card:hover {
      border-color: #444;
      background-color: var(--card-hover);
    }
    .aircraft-card.active {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.15);
    }

    .aircraft-header {
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .aircraft-info {
      flex: 1;
      min-width: 0;
    }
    .aircraft-reg {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #555;
    }
    .status-dot.active { background-color: #00e676; box-shadow: 0 0 8px #00e676; }

    .aircraft-sub {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Thumbnail Foto sulla destra */
    .aircraft-photo-thumb {
      width: 76px;
      height: 50px;
      border-radius: 6px;
      overflow: hidden;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background-color: #151515;
      position: relative;
    }
    .aircraft-photo-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .aircraft-photo-thumb:hover img {
      transform: scale(1.08);
    }

    /* Corpo Dettagli Espansi */
    .aircraft-body {
      display: none;
      padding: 14px;
      background-color: #181818;
      border-top: 1px solid var(--card-border);
    }
    .aircraft-card.active .aircraft-body {
      display: block;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .stat-item {
      background-color: #222;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #2d2d2d;
    }
    .stat-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .stat-val {
      font-size: 1rem;
      font-weight: 600;
      color: var(--accent-cyan);
      margin-top: 2px;
    }

    /* Azioni Card: Cronologia e Pulsante FR24 */
    .card-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-history {
      flex: 1;
      padding: 10px 14px;
      background-color: #292929;
      border: 1px solid #3d3d3d;
      color: #fff;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-history:hover {
      background-color: #383838;
      border-color: #555;
    }

    /* Cerchietto Pulsante FlightRadar24 */
    .btn-fr24 {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background-color: #242217;
      border: 1.5px solid var(--fr24-yellow);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--fr24-yellow);
      transition: all 0.2s ease;
      flex-shrink: 0;
      text-decoration: none;
      position: relative;
    }
    .btn-fr24:hover {
      background-color: var(--fr24-yellow);
      color: #000;
      transform: scale(1.06);
      box-shadow: 0 0 12px rgba(251, 192, 45, 0.4);
    }
    .btn-fr24 svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Modal Storico */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 16px;
    }
    .modal-overlay.open { display: flex; }

    .modal-content {
      background: #181818;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      width: 600px;
      max-width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 { font-size: 1.1rem; }
    .btn-close {
      background: none;
      border: none;
      color: #999;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 4px;
    }
    .btn-close:hover { color: #fff; }

    .modal-body {
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .history-item {
      background: #202020;
      border: 1px solid #2d2d2d;
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .history-item:hover {
      background: #2a2a2a;
      border-color: #444;
    }
    .hist-title { font-weight: 600; font-size: 0.95rem; }
    .hist-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
    .hist-stats { font-weight: 600; font-size: 0.95rem; color: var(--accent-cyan); text-align: right; }

    /* Mobile Responsive */
    @media (max-width: 850px) {
      .main-container { flex-direction: column-reverse; }
      .sidebar { width: 100%; height: 50%; border-left: none; border-top: 1px solid var(--card-border); }
      #map { height: 50%; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>✈</span> SkyTrack <span>Live</span>
    </div>
    <div id="last-update" style="font-size: 0.8rem; color: var(--text-muted);">
      Caricamento flotta...
    </div>
  </header>

  <div class="main-container">
    <div id="map"></div>
    <div class="sidebar">
      <div class="sidebar-header">Velivoli Monitorati</div>
      <div class="fleet-list" id="fleet-container"></div>
    </div>
  </div>

  <!-- Modal Storico -->
  <div class="modal-overlay" id="history-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">Lanci Registrati</h3>
        <button class="btn-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modal-list"></div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let map, activePolyline = null, startMarker = null, endMarker = null;
    let masterData = null;
    let fleetConfig = {};
    let activeReg = null;

    // Inizializza la mappa con layer satellitare ESRI + CartoDB Dark Labels
    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([42.5, 12.5], 7);
      L.control.zoom({ position: 'topright' }).addTo(map);

      // Mappa Satellitare ad alta risoluzione
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri',
        maxZoom: 18
      }).addTo(map);

      // Layer con confini e toponimi semi-trasparenti
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png', {
        subdomains: 'abcd',
        maxZoom: 18
      }).addTo(map);
    }

    // Carica dati
    async function loadData() {
      try {
        const [indexRes, fleetRes] = await Promise.all([
          fetch('data/index.json?v=' + Date.now()).then(r => r.json()),
          fetch('aircraft.json?v=' + Date.now()).then(r => r.json()).catch(() => [])
        ]);

        masterData = indexRes;
        
        // Mappa la configurazione flotta (per foto e coordinate)
        if (Array.isArray(fleetRes)) {
          fleetRes.forEach(ac => { fleetConfig[ac.reg] = ac; });
        }

        renderFleet();

        if (masterData.last_updated) {
          const d = new Date(masterData.last_updated);
          document.getElementById('last-update').textContent = 'Ultimo agg: ' + d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
        }
      } catch (err) {
        console.error('Errore caricamento dati:', err);
      }
    }

    // Renderizza la lista velivoli
    function renderFleet() {
      const container = document.getElementById('fleet-container');
      container.innerHTML = '';

      masterData.aircrafts.forEach(ac => {
        const cfg = fleetConfig[ac.reg] || {};
        const latestRun = (ac.runs && ac.runs.length > 0) ? ac.runs[0] : null;
        const photoUrl = cfg.photo || '';
        
        const card = document.createElement('div');
        card.className = `aircraft-card ${ac.reg === activeReg ? 'active' : ''}`;
        card.id = `card-${ac.reg}`;

        // Header riga velivolo con foto a destra
        card.innerHTML = `
          <div class="aircraft-header" onclick="toggleCard('${ac.reg}')">
            <div class="aircraft-info">
              <div class="aircraft-reg">
                <span class="status-dot ${latestRun ? 'active' : ''}"></span>
                ${ac.reg}
              </div>
              <div class="aircraft-sub">${ac.name || cfg.name || ''}</div>
            </div>

            ${photoUrl ? `
              <div class="aircraft-photo-thumb" title="Clicca per ingrandire foto">
                <a href="${photoUrl}" target="_blank" onclick="event.stopPropagation()">
                  <img src="${photoUrl}" alt="${ac.reg}" onerror="this.parentElement.style.display='none'">
                </a>
              </div>
            ` : ''}
          </div>

          <div class="aircraft-body" id="body-${ac.reg}">
            ${latestRun ? `
              <div style="font-size: 0.78rem; color: #bbb; margin-bottom: 8px;">
                Ultimo Lancio: <strong style="color:#fff;">${latestRun.date} - ${latestRun.time} UTC</strong> (${latestRun.title || ''})
              </div>
              <div class="stats-grid">
                <div class="stat-item">
                  <div class="stat-label">Asse di Lancio</div>
                  <div class="stat-val">${latestRun.heading_deg}°</div>
                </div>
                <div class="stat-item">
                  <div class="stat-label">Ground Speed</div>
                  <div class="stat-val">${latestRun.speed_kt} kt</div>
                </div>
                <div class="stat-item">
                  <div class="stat-label">Durata Run-In</div>
                  <div class="stat-val">${latestRun.duration_sec}s</div>
                </div>
                <div class="stat-item">
                  <div class="stat-label">Separazione 300m</div>
                  <div class="stat-val">${latestRun.speed_kt ? (300 / (latestRun.speed_kt * 0.514444)).toFixed(1) : 0}s</div>
                </div>
              </div>
            ` : `
              <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px;">
                Nessun lancio registrato di recente.
              </div>
            `}

            <div class="card-actions">
              <button class="btn-history" onclick="openHistory('${ac.reg}', event)">
                <span>📋</span> Storico Lanci (${ac.runs ? ac.runs.length : 0})
              </button>

              <!-- Pulsante circolare FlightRadar24 -->
              <a href="https://www.flightradar24.com/data/aircraft/${ac.reg.toLowerCase()}" 
                 target="_blank" 
                 rel="noopener noreferrer"
                 class="btn-fr24" 
                 title="Traccia live su Flightradar24 (${ac.reg})"
                 onclick="event.stopPropagation()">
                <svg viewBox="0 0 24 24">
                  <!-- Icona radar/aereo stilizzato -->
                  <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
                  <path d="M12 6a6 6 0 0 0-6 6h2a4 4 0 0 1 4-4V6zm0-4A10 10 0 0 0 2 12h2a8 8 0 0 1 8-8V2z"/>
                </svg>
              </a>
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    // Espandi/Chiudi card
    function toggleCard(reg) {
      if (activeReg === reg) {
        activeReg = null;
        document.querySelectorAll('.aircraft-card').forEach(c => c.classList.remove('active'));
      } else {
        activeReg = reg;
        document.querySelectorAll('.aircraft-card').forEach(c => c.classList.remove('active'));
        document.getElementById(`card-${reg}`).classList.add('active');

        // Mostra sulla mappa l'ultimo lancio di questo aereo
        const ac = masterData.aircrafts.find(a => a.reg === reg);
        if (ac && ac.runs && ac.runs.length > 0) {
          loadAndDrawRun(ac.runs[0].file);
        }
      }
    }

    // Carica e disegna la traccia GPS sulla mappa
    async function loadAndDrawRun(filePath) {
      try {
        const res = await fetch(`data/runs/${filePath}?v=` + Date.now());
        const runData = await res.json();
        if (!runData.points || runData.points.length === 0) return;

        const latlngs = runData.points.map(p => [p.lat, p.lon]);

        if (activePolyline) map.removeLayer(activePolyline);
        if (startMarker) map.removeLayer(startMarker);
        if (endMarker) map.removeLayer(endMarker);

        // Traccia del Run-in
        activePolyline = L.polyline(latlngs, {
          color: '#00e5ff',
          weight: 5,
          opacity: 0.9,
          lineJoin: 'round'
        }).addTo(map);

        // Marker Inizio
        startMarker = L.circleMarker(latlngs[0], {
          radius: 7,
          fillColor: '#00e676',
          color: '#fff',
          weight: 2,
          fillOpacity: 1
        }).addTo(map).bindPopup(`<b>Inizio Run-in</b><br>${runData.stats.altitude_m}m - ${runData.stats.ground_speed_kt}kt`);

        // Marker Uscita / Picchiata
        endMarker = L.circleMarker(latlngs[latlngs.length - 1], {
          radius: 7,
          fillColor: '#ff1744',
          color: '#fff',
          weight: 2,
          fillOpacity: 1
        }).addTo(map).bindPopup(`<b>Fine Run / Picchiata</b><br>Asse: ${runData.stats.heading_deg}°`);

        map.fitBounds(activePolyline.getBounds(), { padding: [50, 50], maxZoom: 15 });
      } catch (err) {
        console.error('Errore caricamento traccia:', err);
      }
    }

    // Gestione Modal Storico
    function openHistory(reg, event) {
      event.stopPropagation();
      const ac = masterData.aircrafts.find(a => a.reg === reg);
      if (!ac) return;

      document.getElementById('modal-title').textContent = `Lanci Registrati - ${reg}`;
      const list = document.getElementById('modal-list');
      list.innerHTML = '';

      if (!ac.runs || ac.runs.length === 0) {
        list.innerHTML = '<div style="color:#777; text-align:center; padding:20px;">Nessun lancio disponibile.</div>';
      } else {
        ac.runs.forEach(r => {
          const item = document.createElement('div');
          item.className = 'history-item';
          item.innerHTML = `
            <div>
              <div class="hist-title">${r.date} - ${r.title || 'Lancio'}</div>
              <div class="hist-sub">Ore: ${r.time} UTC | Durata: ${r.duration_sec}s</div>
            </div>
            <div class="hist-stats">
              ${r.heading_deg}° / ${r.speed_kt} kt
            </div>
          `;
          item.onclick = () => {
            closeModal();
            loadAndDrawRun(r.file);
          };
          list.appendChild(item);
        });
      }

      document.getElementById('history-modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('history-modal').classList.remove('open');
    }

    window.onclick = function(event) {
      const modal = document.getElementById('history-modal');
      if (event.target === modal) closeModal();
    };

    window.onload = () => {
      initMap();
      loadData();
      setInterval(loadData, 30000); // Ricarica dati ogni 30s
    };
  </script>
</body>
</html>
